name: Auto Update pi-desktop.rb

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - .github/workflows/PI-Desktop.yml
      - Casks/pi-desktop.rb

permissions:
  contents: write

concurrency:
  group: update-pi-desktop
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  Update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Repository Owner
        run: |
          if [ "${{ github.repository_owner }}" != "nxyd" ]; then
            echo "Repository owner is not nxyd. Cancelling the job."
            exit 1
          fi

      - name: Update cask
        run: |
          #!/usr/bin/env bash
          # Bump Casks/pi-desktop.rb to the latest PI-Desktop macOS release.
          #
          # PI-Desktop ships one dmg per architecture:
          #   PI-Desktop-<version>-arm64.dmg
          #   PI-Desktop-<version>-x64.dmg
          # so both sha256 values have to be refreshed on every bump.
          set -euo pipefail

          REPO="vastsa/PI-Desktop"
          CASK="Casks/pi-desktop.rb"
          API_URL="${GITHUB_API_URL:-https://api.github.com}"
          TMP_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          RELEASE_JSON="${TMP_DIR}/pi-desktop-release.json"
          ASSET_REGEX="^PI-Desktop-[0-9.]+-(arm64|x64)\\.dmg$"

          echo "Fetching latest release for ${REPO}"
          curl -fsSL --retry 3 --retry-delay 5 \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}/repos/${REPO}/releases/latest" -o "${RELEASE_JSON}"

          if ! jq -e '.tag_name and (.assets | type == "array")' "${RELEASE_JSON}" >/dev/null 2>&1; then
            echo "::error::Unexpected GitHub API response: $(head -c 300 "${RELEASE_JSON}")"
            exit 1
          fi

          TAG=$(jq -r '.tag_name' "${RELEASE_JSON}")
          if [[ "${TAG}" != v* ]]; then
            echo "::error::Unexpected release tag: ${TAG}"
            exit 1
          fi
          NEW_VERSION="${TAG#v}"

          echo "Latest release: ${TAG}"

          download_and_hash() {
            local arch="$1" url expected_hash dmg
            url=$(jq -r --arg re "PI-Desktop-${NEW_VERSION}-${arch}\\.dmg$" \
              '[.assets[].browser_download_url | select(test($re))] | first // empty' "${RELEASE_JSON}")
            if [[ -z "${url}" ]]; then
              echo "::error::No ${arch} dmg found for ${NEW_VERSION}" >&2
              return 1
            fi

            dmg="${TMP_DIR}/pi-desktop-${arch}.dmg"
            echo "Downloading $(basename "${url}")" >&2
            curl -fsSL --retry 3 --retry-delay 5 -o "${dmg}" "${url}"

            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${dmg}" | awk '{ print $1 }'
            else
              shasum -a 256 "${dmg}" | awk '{ print $1 }'
            fi
            rm -f "${dmg}"
          }

          NEW_ARM64=$(download_and_hash arm64)
          NEW_X64=$(download_and_hash x64)

          CURRENT_VERSION=$(sed -nE 's/^ *version "(.*)"$/\1/p' "${CASK}" | head -n 1)
          CURRENT_ARM64=$(sed -nE 's/^ *sha256 "(.*)"$/\1/p' "${CASK}" | head -n 1)
          CURRENT_X64=$(sed -nE 's/^ *sha256 "(.*)"$/\1/p' "${CASK}" | sed -n 2p)

          echo "Current: ${CURRENT_VERSION} arm64=${CURRENT_ARM64} x64=${CURRENT_X64}"
          echo "Latest:  ${NEW_VERSION} arm64=${NEW_ARM64} x64=${NEW_X64}"

          if [[ "${CURRENT_VERSION}" == "${NEW_VERSION}" \
             && "${CURRENT_ARM64}" == "${NEW_ARM64}" \
             && "${CURRENT_X64}" == "${NEW_X64}" ]]; then
            echo "PI-Desktop is already up to date."
            if [[ -n "${GITHUB_ENV:-}" ]]; then
              echo "UPDATED=false" >> "${GITHUB_ENV}"
            fi
            exit 0
          fi

          # The two sha256 lines are ordered arm64 then x64, written in one pass so
          # each value lands on its own arch block regardless of the cask's layout.
          perl -0777 -pi -e '
            s{^  version ".*"$}{  version "'"${NEW_VERSION}"'"}m;
            my $i = 0;
            s{^( *)sha256 "[0-9a-f]{64}"$}{$1 . "sha256 \"" . ($i++ ? "'"${NEW_X64}"'" : "'"${NEW_ARM64}"'") . "\""}mge;
          ' "${CASK}"

          # Fail loudly instead of committing a broken cask.
          grep -qx "  version \"${NEW_VERSION}\"" "${CASK}"
          grep -qx "    sha256 \"${NEW_ARM64}\"" "${CASK}"
          grep -qx "    sha256 \"${NEW_X64}\"" "${CASK}"

          echo "Updated ${CASK} to ${NEW_VERSION}"
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            echo "UPDATED=true" >> "${GITHUB_ENV}"
            echo "VERSION=${NEW_VERSION}" >> "${GITHUB_ENV}"
          fi

      - name: Commit
        if: env.UPDATED == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Casks/pi-desktop.rb
          git commit -m "Update PI-Desktop to latest version: ${{ env.VERSION }}."

      - name: Push
        if: env.UPDATED == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"